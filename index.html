<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANKUP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--s1:#0d0d1c;--s2:#13132a;--s3:#1a1a35;--border:rgba(100,100,255,0.15);--accent:#6c63ff;--aglow:rgba(108,99,255,0.3);--green:#43e97b;--red:#ff6584;--gold:#ffd700;--silver:#b0b0c0;--bronze:#cd7f32;--text:#eeeeff;--muted:#5555aa;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 15%,rgba(108,99,255,0.08) 0%,transparent 55%),radial-gradient(ellipse at 85% 85%,rgba(67,233,123,0.04) 0%,transparent 55%);pointer-events:none;z-index:0;}
.screen{display:none;min-height:100vh;position:relative;z-index:1;}
.screen.active{display:block;}
.flex-screen{display:none;min-height:100vh;position:relative;z-index:1;align-items:center;justify-content:center;}
.flex-screen.active{display:flex;}
#login-screen{padding:20px;}
.login-wrap{width:100%;max-width:420px;margin:0 auto;padding-top:60px;}
.logo{font-family:'Orbitron',monospace;font-size:52px;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#6c63ff,#43e97b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.logo-sub{color:var(--muted);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:48px;margin-top:6px;}
.card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:32px;}
.card-title{font-size:18px;font-weight:600;margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.field input,.field select{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field select option{background:var(--s2);}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:4px;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{opacity:0.88;transform:translateY(-1px);box-shadow:0 8px 24px var(--aglow);}
.btn-accent:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px;}
.btn-outline:hover{background:rgba(108,99,255,0.1);}
.err{background:rgba(255,101,132,0.1);border:1px solid rgba(255,101,132,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:14px;display:none;}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:16px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border);}
.divider::before{left:0;}.divider::after{right:0;}
#app-screen{flex-direction:column;}
#app-screen.active{display:flex!important;}
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-logo{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#6c63ff,#43e97b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
.btn-sm{padding:7px 14px;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-sm-accent{background:var(--accent);color:#fff;}
.btn-sm-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-sm-ghost:hover{color:var(--text);}
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{flex:1;min-width:70px;padding:13px 6px;border:none;background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}
.content{padding:20px;max-width:700px;margin:0 auto;width:100%;}
.tab-panel{display:none;}.tab-panel.active{display:block;}
.sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;margin-top:24px;}
.sec:first-child{margin-top:0;}
.group-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
.gchip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--s2);color:var(--muted);transition:all 0.2s;white-space:nowrap;}
.gchip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.gchip:hover:not(.active){color:var(--text);}
.lb-table{width:100%;border-collapse:collapse;}
.lb-table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
.lb-table th:not(:first-child){text-align:center;}
.lb-row{border-bottom:1px solid rgba(100,100,255,0.07);transition:background 0.15s;}
.lb-row:hover{background:rgba(108,99,255,0.05);}
.lb-row td{padding:12px 10px;font-size:14px;vertical-align:middle;}
.lb-row td:not(:first-child){text-align:center;}
.rn{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;width:28px;display:inline-block;text-align:center;}
.r1{color:var(--gold);}.r2{color:var(--silver);}.r3{color:var(--bronze);}.r0{color:var(--muted);}
.pnc{display:flex;align-items:center;gap:10px;}
.rbar{height:4px;background:var(--s3);border-radius:2px;width:50px;display:inline-block;vertical-align:middle;margin-left:6px;overflow:hidden;}
.rfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:2px;}
.sg{color:var(--green);}.sb{color:var(--red);}.sn{color:var(--muted);}
.match-builder{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:24px;}
.teams-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-bottom:20px;}
.team-box{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;}
.team-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;}
.vs-badge{display:flex;align-items:center;justify-content:center;padding-top:36px;}
.vs-text{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--muted);}
.pcheck{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:background 0.15s;user-select:none;}
.pcheck:hover{background:rgba(108,99,255,0.1);}
.pcheck input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
.score-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-bottom:20px;}
.siw{display:flex;flex-direction:column;gap:6px;}
.siw label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.siw input{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-family:'Orbitron',monospace;font-size:22px;font-weight:700;text-align:center;outline:none;width:100%;transition:border-color 0.2s;}
.siw input:focus{border-color:var(--accent);}
.sdash{font-family:'Orbitron',monospace;font-size:20px;color:var(--muted);text-align:center;padding-bottom:12px;}
.wsel{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;outline:none;width:100%;margin-bottom:16px;transition:border-color 0.2s;}
.wsel:focus{border-color:var(--accent);}
.mc{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;}
.mct{display:flex;justify-content:space-between;margin-bottom:10px;}
.mm{font-size:11px;color:var(--muted);}
.mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.mteam{display:flex;flex-direction:column;gap:3px;}
.ptag{font-size:13px;font-weight:500;}
.mteam.win .ptag{color:var(--green);}.mteam.lose .ptag{color:var(--muted);}
.mscore{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;text-align:center;white-space:nowrap;}
.sw{color:var(--green);}.sl{color:var(--red);}
.plist{display:flex;flex-direction:column;gap:8px;}
.pitem{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.piL{display:flex;align-items:center;gap:12px;}
.psm{font-size:12px;color:var(--muted);}
.bdanger{background:rgba(255,101,132,0.1);color:var(--red);border:1px solid rgba(255,101,132,0.2);padding:6px 12px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s;}
.bdanger:hover{background:rgba(255,101,132,0.2);}
.add-row{display:flex;gap:10px;margin-top:12px;}
.add-row input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 16px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;}
.add-row input:focus{border-color:var(--accent);}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.scard{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;}
.scv{font-family:'Orbitron',monospace;font-size:26px;font-weight:700;color:var(--accent);}
.scl{font-size:12px;color:var(--muted);margin-top:4px;}
.h2ht{width:100%;border-collapse:collapse;font-size:13px;}
.h2ht th,.h2ht td{padding:8px 10px;text-align:center;}
.h2ht th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);}
.h2ht th:first-child,.h2ht td:first-child{text-align:left;}
.h2ht tr:not(:last-child) td{border-bottom:1px solid rgba(100,100,255,0.06);}
.h2w{color:var(--green);font-weight:600;}.h2l{color:var(--red);}
.gcard{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px;}
.gcH{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.gcN{font-size:17px;font-weight:600;}
.gcM{font-size:12px;color:var(--muted);margin-top:2px;}
.gcC{font-family:monospace;background:var(--s2);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:13px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;color:var(--text);}
.gcC:hover{border-color:var(--accent);color:var(--accent);}
.cphint{font-size:10px;color:var(--muted);margin-top:2px;text-align:center;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px;}
.modal-title{font-size:18px;font-weight:600;margin-bottom:20px;}
.macts{display:flex;gap:10px;margin-top:20px;}
.macts .btn{margin-top:0;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:14px;z-index:999;transition:transform 0.3s;white-space:nowrap;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.success{border-color:rgba(67,233,123,0.4);color:var(--green);}
#toast.error{border-color:rgba(255,101,132,0.4);color:var(--red);}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.loader{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted);}
.spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:12px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:480px){.teams-row{grid-template-columns:1fr;}.vs-badge{padding-top:0;padding-bottom:4px;}.sgrid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div id="login-screen" class="flex-screen active">
  <div class="login-wrap">
    <div class="logo">RANKUP</div>
    <div class="logo-sub">Classement Jeux Video</div>
    <div class="card">
      <div class="card-title">Connexion / Inscription</div>
      <div class="err" id="login-err"></div>
      <div class="field"><label>Nom d'utilisateur</label><input id="login-name" type="text" placeholder="ex: Shadow42" maxlength="20" autocomplete="off"></div>
      <div class="field"><label>Mot de passe</label><input id="login-pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-accent" onclick="doLogin()">Se connecter</button>
      <div class="divider">ou</div>
      <div class="field" id="invite-field" style="display:none;"><label>Code d'invitation</label><input id="login-invite" type="text" placeholder="ex: ABC123" maxlength="8" style="text-transform:uppercase;letter-spacing:2px;font-family:monospace;font-size:16px;text-align:center;"></div>
      <button class="btn btn-outline" id="register-btn" onclick="doShowInvite()">Creer un compte</button>
    </div>
  </div>
</div>

<div id="app-screen" class="screen">
  <div class="topbar">
    <div class="topbar-logo">RANKUP</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="avatar" id="top-avatar">?</div>
      <span style="font-size:13px;font-weight:500;" id="top-name">-</span>
      <button class="btn-sm btn-sm-ghost" onclick="doLogout()">off</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('rank')">Classement</button>
    <button class="tab" onclick="switchTab('match')">Partie</button>
    <button class="tab" onclick="switchTab('history')">Historique</button>
    <button class="tab" onclick="switchTab('stats')">Stats</button>
    <button class="tab" onclick="switchTab('players')">Joueurs</button>
    <button class="tab" onclick="switchTab('groups')">Groupes</button>
    <button class="tab" onclick="switchTab('admin')">Admin</button>
  </div>
  <div class="content">
    <div id="group-bar-wrap" style="display:none;margin-bottom:4px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">Groupe actif</span>
        <button class="btn-sm btn-sm-accent" onclick="openModal('modal-new-group')">+ Groupe</button>
      </div>
      <div class="group-bar" id="group-bar"></div>
    </div>
    <div id="tab-rank" class="tab-panel active"><div class="loader"><div class="spin"></div>Chargement...</div></div>
    <div id="tab-match" class="tab-panel">
      <div class="match-builder">
        <div class="sec">Equipes</div>
        <div class="teams-row">
          <div class="team-box"><div class="team-label">Equipe A</div><div id="team-a-players"></div></div>
          <div class="vs-badge"><div class="vs-text">VS</div></div>
          <div class="team-box"><div class="team-label">Equipe B</div><div id="team-b-players"></div></div>
        </div>
        <div class="sec">Score</div>
        <div class="score-row">
          <div class="siw"><label>Equipe A</label><input type="number" id="score-a" min="0" max="13" placeholder="13" oninput="clampScore(this)"></div>
          <div class="sdash">-</div>
          <div class="siw"><label>Equipe B</label><input type="number" id="score-b" min="0" max="13" placeholder="7" oninput="clampScore(this)"></div>
        </div>
        <div class="sec">Equipe gagnante (score 13)</div>
        <select class="wsel" id="winner-select">
          <option value="">-- Selectionner --</option>
          <option value="A">Equipe A</option>
          <option value="B">Equipe B</option>
        </select>
        <button class="btn btn-accent" onclick="submitMatch()">Valider la partie</button>
      </div>
    </div>
    <div id="tab-history" class="tab-panel"><div class="loader"><div class="spin"></div>Chargement...</div></div>
    <div id="tab-stats" class="tab-panel">
      <div class="field" style="margin-bottom:16px;">
        <label>Joueur</label>
        <select class="wsel" id="stats-player-select" style="margin-bottom:0;" onchange="renderStats()">
          <option value="">-- Choisir un joueur --</option>
        </select>
      </div>
      <div id="stats-content"></div>
    </div>
    <div id="tab-players" class="tab-panel"><div class="loader"><div class="spin"></div>Chargement...</div></div>
    <div id="tab-groups" class="tab-panel"><div class="loader"><div class="spin"></div>Chargement...</div></div>
    <div id="tab-admin" class="tab-panel"><div id="admin-panel"><div class="loader"><div class="spin"></div>Chargement...</div></div></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-new-group">
  <div class="modal">
    <div class="modal-title">Creer un groupe</div>
    <div class="err" id="group-err"></div>
    <div class="field"><label>Nom du groupe</label><input id="group-name-input" type="text" placeholder="ex: Les Potes" maxlength="30"></div>
    <div class="macts">
      <button class="btn btn-accent" style="flex:1" onclick="createGroup()">Creer</button>
      <button class="btn btn-outline" style="flex:1;margin-top:0" onclick="closeModal('modal-new-group')">Annuler</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-join-group">
  <div class="modal">
    <div class="modal-title">Rejoindre un groupe</div>
    <div class="err" id="join-err"></div>
    <div class="field"><label>Code du groupe</label><input id="join-code-input" type="text" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:3px;font-family:monospace;font-size:18px;text-align:center;"></div>
    <div class="macts">
      <button class="btn btn-accent" style="flex:1" onclick="joinGroup()">Rejoindre</button>
      <button class="btn btn-outline" style="flex:1;margin-top:0" onclick="closeModal('modal-join-group')">Annuler</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGnBFB0Iu8psV4H8-MLODyOF5_1I1Ax-Q",
  authDomain: "rankup-saintvidal.firebaseapp.com",
  databaseURL: "https://rankup-saintvidal-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "rankup-saintvidal",
  storageBucket: "rankup-saintvidal.firebasestorage.app",
  messagingSenderId: "1018715923099",
  appId: "1:1018715923099:web:eabc2ef18eae1ae915dc3e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let CU = null, CGid = null, CGdata = null, groups = {}, unsub = null;

const genCode = () => Math.random().toString(36).substring(2,8).toUpperCase();
const initials = n => n.slice(0,2).toUpperCase();
const fmtDate = ts => new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || 'success');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className = ''; }, 2600);
}
window.openModal = function(id){ document.getElementById(id).classList.add('open'); };
window.closeModal = function(id){ document.getElementById(id).classList.remove('open'); };
window.clampScore = function(el){ var v=parseInt(el.value); if(!isNaN(v)){if(v<0)el.value=0;if(v>13)el.value=13;} };

window.doLogin = async function() {
  var name = document.getElementById('login-name').value.trim();
  var pass = document.getElementById('login-pass').value;
  var err = document.getElementById('login-err');
  err.style.display = 'none';
  if(!name || !pass){ err.textContent='Remplis tous les champs.'; err.style.display='block'; return; }
  try {
    var snap = await get(ref(db, 'users/' + name));
    if(!snap.exists()){ err.textContent='Utilisateur introuvable.'; err.style.display='block'; return; }
    if(snap.val().password !== btoa(pass)){ err.textContent='Mot de passe incorrect.'; err.style.display='block'; return; }
    CU = Object.assign({name: name}, snap.val());
    startApp();
  } catch(e){ err.textContent='Erreur: ' + e.message; err.style.display='block'; }
};

window.doRegister = async function() {
  var name = document.getElementById('login-name').value.trim();
  var pass = document.getElementById('login-pass').value;
  var invite = document.getElementById('login-invite').value.trim().toUpperCase();
  var err = document.getElementById('login-err');
  err.style.display = 'none';
  if(!name || !pass){ err.textContent='Remplis tous les champs.'; err.style.display='block'; return; }
  if(name.length < 2){ err.textContent='Nom trop court (2 min).'; err.style.display='block'; return; }
  if(pass.length < 4){ err.textContent='Mot de passe trop court (4 min).'; err.style.display='block'; return; }
  try {
    var adminSnap = await get(ref(db, 'admins'));
    var isFirst = !adminSnap.exists();
    if(!isFirst){
      if(!invite){ err.textContent='Code invitation requis.'; err.style.display='block'; return; }
      var invSnap = await get(ref(db, 'inviteCodes/' + invite));
      if(!invSnap.exists() || invSnap.val().used){ err.textContent='Code invalide ou deja utilise.'; err.style.display='block'; return; }
      await set(ref(db, 'inviteCodes/' + invite + '/used'), true);
      await set(ref(db, 'inviteCodes/' + invite + '/usedBy'), name);
    }
    var exists = await get(ref(db, 'users/' + name));
    if(exists.exists()){ err.textContent='Nom deja pris.'; err.style.display='block'; return; }
    var ud = {password: btoa(pass), createdAt: Date.now(), isAdmin: isFirst};
    await set(ref(db, 'users/' + name), ud);
    if(isFirst) await set(ref(db, 'admins/' + name), true);
    CU = Object.assign({name: name}, ud);
    startApp();
    showToast(isFirst ? 'Bienvenue admin ' + name + '!' : 'Bienvenue ' + name + '!');
  } catch(e){ err.textContent='Erreur: ' + e.message; err.style.display='block'; }
};

function computeStats(){
  var players = getPlayers();
  var stats = {};
  Object.keys(players).forEach(function(pid){ stats[pid] = {wins:0, losses:0, played:0, ga:0}; });
  getMatches().forEach(function(m){
    var wt = m.winner==='A' ? m.teamA : m.teamB;
    var lt = m.winner==='A' ? m.teamB : m.teamA;
    var ws = m.winner==='A' ? m.scoreA : m.scoreB;
    var ls = m.winner==='A' ? m.scoreB : m.scoreA;
    var diff = ws - ls;
    wt.forEach(function(pid){ if(!stats[pid]) stats[pid]={wins:0,losses:0,played:0,ga:0}; stats[pid].wins++; stats[pid].played++; stats[pid].ga+=diff; });
    lt.forEach(function(pid){ if(!stats[pid]) stats[pid]={wins:0,losses:0,played:0,ga:0}; stats[pid].losses++; stats[pid].played++; stats[pid].ga-=diff; });
  });
  return stats;
}

function h2h(pA, pB){
  var wA=0, wB=0;
  getMatches().forEach(function(m){
    var aInA=m.teamA.includes(pA), aInB=m.teamB.includes(pA);
    var bInA=m.teamA.includes(pB), bInB=m.teamB.includes(pB);
    if(!((aInA&&bInB)||(aInB&&bInA))) return;
    if(m.winner === (aInA?'A':'B')) wA++; else wB++;
  });
  return {wA:wA, wB:wB};
}

function renderLeaderboard(){
  var players = getPlayers();
  var entries = Object.entries(players);
  if(!entries.length){ document.getElementById('tab-rank').innerHTML='<div class="empty"><div class="empty-icon">🏆</div><div class="empty-text">Ajoute des joueurs !</div></div>'; return; }
  var stats = computeStats();
  var rows = entries.map(function(e){ return Object.assign({id:e[0], name:e[1].name}, stats[e[0]]||{wins:0,losses:0,played:0,ga:0}); });
  rows.sort(function(a,b){
    var ra=a.played>0?a.wins/a.played:0, rb=b.played>0?b.wins/b.played:0;
    if(rb!==ra) return rb-ra;
    if(b.played!==a.played) return b.played-a.played;
    var hh=h2h(a.id,b.id); if(hh.wA!==hh.wB) return hh.wB-hh.wA;
    return b.ga-a.ga;
  });
  var html = '<table class="lb-table"><thead><tr><th>#</th><th style="text-align:left">Joueur</th><th>V</th><th>D</th><th>%</th><th>GA</th></tr></thead><tbody>';
  rows.forEach(function(p,i){
    var ratio = p.played>0?p.wins/p.played:0;
    var rc = i===0?'r1':i===1?'r2':i===2?'r3':'r0';
    var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    html += '<tr class="lb-row"><td><span class="rn ' + rc + '">' + (medal||i+1) + '</span></td>' +
      '<td><div class="pnc"><div class="avatar" style="width:28px;height:28px;font-size:10px;">' + initials(p.name) + '</div><span style="font-weight:500">' + p.name + '</span></div></td>' +
      '<td class="sg">' + p.wins + '</td><td class="sb">' + p.losses + '</td>' +
      '<td><span style="font-family:Orbitron,monospace;font-size:12px;font-weight:700;">' + (p.played>0?(ratio*100).toFixed(0):'-') + '%</span><span class="rbar"><span class="rfill" style="width:' + (ratio*100) + '%"></span></span></td>' +
      '<td class="' + (p.ga>0?'sg':p.ga<0?'sb':'sn') + '" style="font-family:Orbitron,monospace;font-size:12px;">' + (p.ga>0?'+':'') + p.ga + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tab-rank').innerHTML = html;
}

window.renderStats = function(){
  var pid = document.getElementById('stats-player-select').value;
  if(!pid){ document.getElementById('stats-content').innerHTML=''; return; }
  var stats = computeStats();
  var s = stats[pid] || {wins:0,losses:0,played:0,ga:0};
  var ratio = s.played>0?((s.wins/s.played)*100).toFixed(1):'0.0';
  var myM = getMatches().filter(function(m){ return m.teamA.includes(pid)||m.teamB.includes(pid); }).sort(function(a,b){ return a.createdAt-b.createdAt; });
  var maxS=0, curS=0, streak=0;
  myM.forEach(function(m){ var w=m.winner==='A'?m.teamA.includes(pid):m.teamB.includes(pid); if(w){curS++;if(curS>maxS)maxS=curS;}else curS=0; });
  if(myM.length){
    var last=myM[myM.length-1], lastW=last.winner==='A'?last.teamA.includes(pid):last.teamB.includes(pid);
    var i=myM.length-1;
    while(i>=0){ var m=myM[i],w=m.winner==='A'?m.teamA.includes(pid):m.teamB.includes(pid); if(w===lastW){streak++;i--;}else break; }
    if(!lastW) streak=-streak;
  }
  var others = Object.entries(getPlayers()).filter(function(e){ return e[0]!==pid; });
  var h2hHtml = others.length ? '<div class="sec" style="margin-top:20px;">Confrontations directes</div><table class="h2ht"><thead><tr><th>Adversaire</th><th>V</th><th>D</th></tr></thead><tbody>' : '';
  others.forEach(function(e){
    var h=h2h(pid,e[0]);
    h2hHtml += '<tr><td><div style="display:flex;align-items:center;gap:8px;"><div class="avatar" style="width:22px;height:22px;font-size:8px;">' + initials(e[1].name) + '</div>' + e[1].name + '</div></td><td class="h2w">' + h.wA + '</td><td class="h2l">' + h.wB + '</td></tr>';
  });
  if(others.length) h2hHtml += '</tbody></table>';
  document.getElementById('stats-content').innerHTML =
    '<div class="sgrid">' +
    '<div class="scard"><div class="scv">' + ratio + '%</div><div class="scl">Ratio victoires</div></div>' +
    '<div class="scard"><div class="scv">' + s.played + '</div><div class="scl">Parties jouees</div></div>' +
    '<div class="scard"><div class="scv sg">' + s.wins + '</div><div class="scl">Victoires</div></div>' +
    '<div class="scard"><div class="scv sb">' + s.losses + '</div><div class="scl">Defaites</div></div>' +
    '<div class="scard"><div class="scv ' + (s.ga>=0?'sg':'sb') + '">' + (s.ga>0?'+':'') + s.ga + '</div><div class="scl">Goal Average</div></div>' +
    '<div class="scard"><div class="scv ' + (streak>0?'sg':streak<0?'sb':'sn') + '">' + (streak>0?'🔥 '+streak:streak<0?'❄️ '+Math.abs(streak):'-') + '</div><div class="scl">Serie actuelle</div></div>' +
    '</div><div class="scard" style="margin-bottom:12px;"><div class="scv">' + maxS + '</div><div class="scl">Meilleure serie</div></div>' + h2hHtml;
};

  var panel = document.getElementById('admin-panel');
  if(!panel) return;
  var admin = await checkAdmin();
  if(!admin){ panel.innerHTML='<div class="empty"><div class="empty-icon">🔒</div><div class="empty-text">Acces reserve aux administrateurs.</div></div>'; return; }
  var usersSnap = await get(ref(db,'users'));
  var adminsSnap = await get(ref(db,'admins'));
  var codesSnap = await get(ref(db,'inviteCodes'));
  var users = usersSnap.exists()?usersSnap.val():{};
  var admins = adminsSnap.exists()?adminsSnap.val():{};
  var codes = codesSnap.exists()?codesSnap.val():{};
  var activeCodes = Object.entries(codes).filter(function(e){ return !e[1].used; });
  var usedCount = Object.values(codes).filter(function(c){ return c.used; }).length;
  var html = '<div class="sec">Codes invitation</div>';
  html += '<button class="btn btn-accent" style="width:auto;padding:10px 20px;margin-bottom:16px;" onclick="generateInviteCode()">+ Generer un code</button>';
  if(!activeCodes.length){
    html += '<div style="font-size:13px;color:var(--muted);margin-bottom:16px;">Aucun code actif.</div>';
  } else {
    html += '<div class="plist" style="margin-bottom:8px;">';
    activeCodes.forEach(function(e){
      var code=e[0], c=e[1];
      html += '<div class="pitem"><div class="piL"><div style="font-family:monospace;font-size:18px;letter-spacing:3px;color:var(--accent);font-weight:700;">' + code + '</div><div class="psm">par ' + c.createdBy + '</div></div>' +
        '<div style="display:flex;gap:8px;"><button class="btn-sm btn-sm-ghost" onclick="navigator.clipboard.writeText(\'' + code + '\').then(function(){showToast(\'Copie !\')})" >Copier</button><button class="bdanger" onclick="deleteInviteCode(\'' + code + '\')">X</button></div></div>';
    });
    html += '</div>';
  }
  if(usedCount > 0) html += '<div style="font-size:12px;color:var(--muted);margin-bottom:20px;">' + usedCount + ' code(s) utilise(s)</div>';
  html += '<div class="sec">Comptes utilisateurs</div><div class="plist">';
  Object.entries(users).forEach(function(e){
    var uname=e[0], isAdm=admins[uname], isMe=uname===CU.name;
    html += '<div class="pitem"><div class="piL"><div class="avatar" style="width:34px;height:34px;font-size:12px;">' + uname.slice(0,2).toUpperCase() + '</div>' +
      '<div><div style="font-weight:500;">' + uname + (isAdm?' 👑':'') + (isMe?' (moi)':'') + '</div><div class="psm">' + (isAdm?'Administrateur':'Membre') + '</div></div></div>' +
      '<div style="display:flex;gap:6px;">' +
      (!isAdm&&!isMe ? '<button class="btn-sm btn-sm-accent" onclick="makeAdmin(\'' + uname + '\')">Admin</button>' : '') +
      (isAdm&&!isMe ? '<button class="btn-sm btn-sm-ghost" onclick="removeAdminRole(\'' + uname + '\')">-admin</button>' : '') +
      (!isMe ? '<button class="bdanger" onclick="deleteUser(\'' + uname + '\')">X</button>' : '') +
      '</div></div>';
  });
  html += '</div>';
  panel.innerHTML = html;
}

var tabNames = ['rank','match','history','stats','players','groups','admin'];
window.switchTab = function(tab){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab')[tabNames.indexOf(tab)].classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  refreshTab();
};

function refreshTab(){
  var active = document.querySelector('.tab-panel.active');
  if(!active) return;
  var id = active.id;
  if(id==='tab-rank') renderLeaderboard();
  else if(id==='tab-history') renderHistory();
  else if(id==='tab-players') renderPlayers();
  else if(id==='tab-match') renderMatchPlayers();
  else if(id==='tab-stats'){ renderPlayers(); renderStats(); }
  else if(id==='tab-groups') renderGroupsPanel();
  else if(id==='tab-admin') renderAdminPanel();
}
</script>
</body>
</html>
